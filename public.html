<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QueueLess - Public Queue</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f8f5;
            color: #173b35;
            min-height: 100vh;
        }

        .header {
            background: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #dceae5;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #16806f;
        }

        .time {
            color: #60756f;
            font-size: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .title p {
            color: #60756f;
            font-size: 18px;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;

            text-align: center;

            border: 1px solid #dceae5;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.05);
        }

        .serving-label {
            color: #60756f;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .current-token {
            font-size: 80px;
            font-weight: bold;
            color: #16806f;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
            margin-bottom: 35px;
        }

        .stat {
            background: #f1f8f5;
            border-radius: 14px;
            padding: 25px;
        }

        .stat-label {
            color: #60756f;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #173b35;
        }

        .counters-title {
            text-align: left;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .counter-list {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }

        .counter {
            border: 1px solid #dceae5;
            border-radius: 12px;
            padding: 18px;
            background: white;
        }

        .counter-name {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .counter-token {
            color: #16806f;
            font-size: 25px;
            font-weight: bold;
        }

        .empty {
            color: #9aa9a5;
        }

        .updated {
            margin-top: 30px;
            color: #71847f;
            font-size: 13px;
        }


        @media (max-width: 700px) {

            .header {
                padding: 15px 20px;
            }

            .title h1 {
                font-size: 28px;
            }

            .current-token {
                font-size: 55px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .counter-list {
                grid-template-columns: 1fr;
            }

            .main-card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


<div class="header">

    <div class="logo">
        QueueLess
    </div>

    <div id="clock"
         class="time">
    </div>

</div>


<div class="container">


    <div class="title">

        <h1>
            Accounts Office
        </h1>

        <p>
            Live Queue Display
        </p>

    </div>


    <div class="main-card">


        <div class="serving-label">
            NOW SERVING
        </div>


        <div id="currentToken"
             class="current-token">

            --

        </div>


        <div class="stats">


            <div class="stat">

                <div class="stat-label">
                    People Waiting
                </div>

                <div id="waitingCount"
                     class="stat-value">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    Estimated Wait
                </div>

                <div id="estimatedWait"
                     class="stat-value">

                    0 min

                </div>

            </div>


        </div>


        <div class="counters-title">
            Service Counters
        </div>


        <div id="counterList"
             class="counter-list">

        </div>


        <div id="updated"
             class="updated">

            Last updated: --

        </div>


    </div>

</div>


<script>


async function loadQueue() {

    try {

        const response =
            await fetch("CounterServlet");

        const counters =
            await response.json();


        displayCounters(counters);


        calculateQueue();


    } catch (error) {

        console.error(
            "Unable to load queue:",
            error
        );

    }

}



function displayCounters(counters) {

    const list =
        document.getElementById(
            "counterList"
        );


    list.innerHTML = "";


    let currentServing =
        "--";


    counters.forEach(counter => {


        const div =
            document.createElement("div");


        div.className =
            "counter";


        const token =
            counter.currentToken;


        if (token) {

            currentServing =
                token;

        }


        div.innerHTML = `

            <div class="counter-name">

                ${counter.counterName}

            </div>

            <div class="counter-token
                ${token ? "" : "empty"}">

                ${token || "--"}

            </div>

        `;


        list.appendChild(div);

    });


    document.getElementById(
        "currentToken"
    ).innerText =
        currentServing;

}



async function calculateQueue() {

    try {

        const response =
            await fetch(
                "TrackQueueServlet?token=A001"
            );


        /*
         * We use the existing queue
         * tracking servlet to get
         * queue information.
         */

        const data =
            await response.json();


        if (data.success) {

            document.getElementById(
                "waitingCount"
            ).innerText =
                data.peopleAhead;


            document.getElementById(
                "estimatedWait"
            ).innerText =
                data.estimatedWait + " min";

        }

    } catch (error) {

        console.error(
            "Queue information error:",
            error
        );

    }


    document.getElementById(
        "updated"
    ).innerText =
        "Last updated: "
        + new Date().toLocaleTimeString();

}



function updateClock() {

    document.getElementById(
        "clock"
    ).innerText =
        new Date().toLocaleTimeString();

}


updateClock();

loadQueue();


setInterval(
    updateClock,
    1000
);


setInterval(
    loadQueue,
    5000
);


</script>


</body>

</html>
