<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register - QueueLess</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8f5;
            color: #183b36;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 40px auto;
            padding: 20px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #16806f;
        }

        .subtitle {
            text-align: center;
            color: #657873;
            margin: 8px 0 25px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .field {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6e3df;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        input:focus {
            outline: none;
            border-color: #16806f;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #16806f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #116b5d;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #16806f;
            font-weight: bold;
            text-decoration: none;
        }

        @media(max-width:600px) {
            .row {
                display: block;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">QueueLess</div>

    <div class="subtitle">
        Create your student account
    </div>

    <div class="card">

        <h2>Student Registration</h2>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="fullName" required>

            <div class="row">

                <div class="field">
                    <label>Student ID</label>
                    <input type="text" id="studentId" required>
                </div>

                <div class="field">
                    <label>Phone</label>
                    <input type="text" id="phone">
                </div>

            </div>

            <label>Email</label>
            <input type="email" id="email" required>

            <div class="row">

                <div class="field">
                    <label>Department</label>
                    <input type="text" id="department">
                </div>

                <div class="field">
                    <label>Course</label>
                    <input type="text" id="course">
                </div>

            </div>

            <label>Semester</label>
            <input type="text" id="semester">

            <label>Password</label>
            <input type="password" id="password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" required>

            <button type="submit">
                Create Account
            </button>

        </form>

        <div class="message" id="message"></div>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("message");

    if (password !== confirmPassword) {

        message.style.color = "#d9534f";
        message.innerHTML = "Passwords do not match.";
        return;
    }

    message.style.color = "#16806f";
    message.innerHTML = "Creating account...";

    const data = new URLSearchParams();

    data.append("action", "REGISTER");
    data.append("fullName", document.getElementById("fullName").value);
    data.append("studentId", document.getElementById("studentId").value);
    data.append("phone", document.getElementById("phone").value);
    data.append("email", document.getElementById("email").value);
    data.append("department", document.getElementById("department").value);
    data.append("course", document.getElementById("course").value);
    data.append("semester", document.getElementById("semester").value);
    data.append("password", password);

    fetch("AuthServlet", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: data.toString()
    })
    .then(response => response.json())
    .then(result => {

        if (result.success) {

            message.style.color = "#16806f";
            message.innerHTML = "Registration successful! Redirecting...";

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1200);

        } else {

            message.style.color = "#d9534f";
            message.innerHTML = result.message;
        }

    })
    .catch(error => {

        message.style.color = "#d9534f";
        message.innerHTML = "Unable to connect to server.";

        console.error(error);
    });

});

</script>

</body>
</html>
