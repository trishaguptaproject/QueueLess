<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QueueLess - Appointments</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f8f5;
            color: #173b35;
            min-height: 100vh;
        }

        header {
            background: white;
            padding: 18px 40px;
            border-bottom: 1px solid #dceae5;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #16806f;
        }

        .back {
            text-decoration: none;
            color: #16806f;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .title p {
            color: #60756f;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;

            border: 1px solid #dceae5;

            box-shadow:
                0 6px 20px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccdcd7;
            border-radius: 9px;

            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #16806f;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #16806f;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 9px;
            font-weight: bold;
        }

        .success {
            display: block;
            background: #dff5eb;
            color: #16806f;
        }

        .error {
            display: block;
            background: #fce4e4;
            color: #c0392b;
        }

        .appointments {
            margin-top: 35px;
        }

        .appointments h2 {
            margin-bottom: 15px;
        }

        .appointment-card {
            background: white;
            border: 1px solid #dceae5;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .appointment-card strong {
            color: #16806f;
        }

        @media (max-width: 650px) {

            header {
                padding: 15px 20px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        QueueLess
    </div>

    <a href="index.html"
       class="back">
        ← Home
    </a>

</header>


<div class="container">


    <div class="title">

        <h1>
            Book an Appointment
        </h1>

        <p>
            Schedule your campus service appointment
        </p>

    </div>


    <div class="card">

        <form id="appointmentForm">


            <div class="form-group">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label for="serviceName">
                    Select Service
                </label>

                <select
                    id="serviceName"
                    required>

                    <option value="">
                        Select a service
                    </option>

                    <option value="Accounts Office">
                        Accounts Office
                    </option>

                    <option value="Student Helpdesk">
                        Student Helpdesk
                    </option>

                    <option value="Documents">
                        Documents
                    </option>

                </select>

            </div>


            <div class="row">


                <div class="form-group">

                    <label for="appointmentDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="appointmentDate"
                        required>

                </div>


                <div class="form-group">

                    <label for="appointmentTime">
                        Time
                    </label>

                    <input
                        type="time"
                        id="appointmentTime"
                        required>

                </div>


            </div>


            <div class="form-group">

                <label for="reason">
                    Reason
                </label>

                <textarea
                    id="reason"
                    placeholder="Enter reason for appointment"></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn">

                Book Appointment

            </button>


            <div
                id="message"
                class="message">
            </div>


        </form>

    </div>


    <div class="appointments">

        <h2>
            Existing Appointments
        </h2>

        <div id="appointmentList">

            Loading appointments...

        </div>

    </div>


</div>


<script>


const form =
    document.getElementById(
        "appointmentForm"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const formData =
            new URLSearchParams();


        formData.append(
            "studentName",
            document.getElementById(
                "studentName"
            ).value
        );


        formData.append(
            "serviceName",
            document.getElementById(
                "serviceName"
            ).value
        );


        formData.append(
            "appointmentDate",
            document.getElementById(
                "appointmentDate"
            ).value
        );


        formData.append(
            "appointmentTime",
            document.getElementById(
                "appointmentTime"
            ).value
        );


        formData.append(
            "reason",
            document.getElementById(
                "reason"
            ).value
        );


        try {

            const response =
                await fetch(
                    "AppointmentServlet",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body: formData
                    }
                );


            const data =
                await response.json();


            showMessage(
                data.message,
                data.success
            );


            if (data.success) {

                form.reset();

                loadAppointments();

            }


        } catch (error) {

            showMessage(
                "Unable to connect to server.",
                false
            );

        }

    }
);



function showMessage(
    message,
    success
) {

    const box =
        document.getElementById(
            "message"
        );


    box.innerText =
        message;


    box.className =
        success
            ? "message success"
            : "message error";

}



async function loadAppointments() {

    try {

        const response =
            await fetch(
                "AppointmentServlet"
            );


        const data =
            await response.json();


        const list =
            document.getElementById(
                "appointmentList"
            );


        if (data.length === 0) {

            list.innerHTML =
                "<p>No appointments yet.</p>";

            return;

        }


        list.innerHTML = "";


        data.forEach(
            appointment => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "appointment-card";


                card.innerHTML = `

                    <strong>
                        ${appointment.studentName}
                    </strong>

                    <br><br>

                    Service:
                    ${appointment.serviceName}

                    <br>

                    Date:
                    ${appointment.appointmentDate}

                    <br>

                    Time:
                    ${appointment.appointmentTime}

                    <br>

                    Reason:
                    ${appointment.reason || "Not specified"}

                    <br>

                    Status:
                    <strong>
                        ${appointment.status}
                    </strong>

                `;


                list.appendChild(card);

            }
        );


    } catch (error) {

        document.getElementById(
            "appointmentList"
        ).innerText =
            "Unable to load appointments.";

    }

}



loadAppointments();

</script>


</body>

</html>
