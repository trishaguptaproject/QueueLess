<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Help Desk - QueueLess</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f8f5;
            color: #17352f;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dcebe5;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #16806f;
        }

        .back {
            text-decoration: none;
            color: #16806f;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin-bottom: 8px;
            font-size: 32px;
        }

        .page-title p {
            color: #657871;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .card h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbdcd6;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        input:focus,
        textarea:focus {
            border-color: #16806f;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .submit-btn {
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            background: #16806f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #126b5d;
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
        }

        .success {
            background: #e3f6ed;
            color: #176b4e;
        }

        .error {
            background: #fde8e8;
            color: #a12626;
        }

        .request-card {
            border: 1px solid #dcebe5;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .request-card h3 {
            margin-top: 0;
            color: #16806f;
        }

        .request-info {
            margin: 8px 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            font-weight: bold;
        }

        .no-data {
            color: #71817c;
        }

        @media (max-width: 700px) {

            .container {
                width: 94%;
            }

            header {
                padding: 16px 4%;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        QueueLess
    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</header>


<div class="container">

    <div class="page-title">

        <h1>Student Help Desk</h1>

        <p>
            Submit your question or issue and get assistance from the college help desk.
        </p>

    </div>


    <!-- FORM -->

    <div class="card">

        <h2>Submit a Help Desk Request</h2>

        <form id="helpDeskForm">

            <div class="form-group">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Enter your issue or question"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe your issue in detail"
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Submit Request
            </button>

        </form>


        <div id="message"></div>

    </div>


    <!-- REQUEST LIST -->

    <div class="card">

        <h2>Submitted Help Desk Requests</h2>

        <div id="requests">

            <p class="no-data">
                Loading requests...
            </p>

        </div>

    </div>

</div>


<script>

    const form =
        document.getElementById("helpDeskForm");

    const message =
        document.getElementById("message");

    const submitBtn =
        document.getElementById("submitBtn");

    const requestsDiv =
        document.getElementById("requests");


    // SUBMIT REQUEST

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = "Submitting...";


        const studentName =
            document.getElementById("studentName")
            .value.trim();

        const subject =
            document.getElementById("subject")
            .value.trim();

        const description =
            document.getElementById("description")
            .value.trim();


        const formData =
            new URLSearchParams();

        formData.append(
            "studentName",
            studentName
        );

        formData.append(
            "subject",
            subject
        );

        formData.append(
            "description",
            description
        );


        fetch("HelpDeskServlet", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded"
            },

            body: formData.toString()

        })

        .then(response => response.json())

        .then(data => {

            if (data.success) {

                message.className = "success";

                message.innerText =
                    "✓ " + data.message;

                message.style.display = "block";

                form.reset();

                loadRequests();

            } else {

                message.className = "error";

                message.innerText =
                    "✗ " + data.message;

                message.style.display = "block";
            }

        })

        .catch(error => {

            console.error(error);

            message.className = "error";

            message.innerText =
                "✗ Unable to submit request. Please try again.";

            message.style.display = "block";

        })

        .finally(() => {

            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Request";

        });

    });


    // LOAD REQUESTS

    function loadRequests() {

        fetch("HelpDeskServlet")

        .then(response => response.json())

        .then(data => {

            requestsDiv.innerHTML = "";


            if (!Array.isArray(data)
                    || data.length === 0) {

                requestsDiv.innerHTML =
                    '<p class="no-data">' +
                    'No help desk requests found.' +
                    '</p>';

                return;
            }


            data.forEach(request => {

                const card =
                    document.createElement("div");

                card.className =
                    "request-card";


                card.innerHTML = `

                    <h3>
                        ${escapeHtml(request.subject)}
                    </h3>

                    <p class="request-info">
                        <strong>Student:</strong>
                        ${escapeHtml(request.studentName)}
                    </p>

                    <p class="request-info">
                        <strong>Description:</strong>
                        ${escapeHtml(request.description)}
                    </p>

                    <p class="request-info">
                        <strong>Status:</strong>

                        <span class="status">
                            ${escapeHtml(request.status)}
                        </span>
                    </p>

                `;


                requestsDiv.appendChild(card);

            });

        })

        .catch(error => {

            console.error(error);

            requestsDiv.innerHTML =
                '<p class="no-data">' +
                'Unable to load requests.' +
                '</p>';

        });

    }


    // HTML ESCAPING

    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // LOAD WHEN PAGE OPENS

    loadRequests();

</script>

</body>
</html>
