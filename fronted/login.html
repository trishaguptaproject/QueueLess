<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QueueLess - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4fbf9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #0f766e;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0f766e;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #0f766e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #115e59;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #d32f2f;
            font-size: 14px;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register a {
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
        }

        .admin-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #eee;
        }

        .admin-link a {
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .admin-link a:hover {
            color: #0f766e;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">QueueLess</div>

    <div class="subtitle">
        Smart Student Campus Service Platform
    </div>

    <form id="loginForm">

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

    <div class="admin-link">
        <a href="admin-login.html">
            Administrator Login
        </a>
    </div>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    message.style.color = "#555";
    message.innerText = "Logging in...";

    fetch("AuthServlet", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body:
            "action=LOGIN" +
            "&email=" + encodeURIComponent(email) +
            "&password=" + encodeURIComponent(password)
    })

    .then(response => response.json())

    .then(data => {

        if (data.success) {

            /*
             * ADMIN USERS GO TO admin.html
             * NOT admin-dashboard.html
             */

            if (data.role === "ADMIN") {

                window.location.href = "admin.html";

            } else {

                window.location.href = "dashboard.html";

            }

        } else {

            message.style.color = "#d32f2f";
            message.innerText = data.message || "Invalid email or password.";

        }

    })

    .catch(error => {

        console.error(error);

        message.style.color = "#d32f2f";
        message.innerText = "Unable to connect to server.";

    });

});

</script>

</body>
</html>
