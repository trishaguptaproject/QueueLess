<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - QueueLess</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f8f5;
            color: #17352f;
        }

        /* ================= HEADER ================= */

        header {
            background: white;
            padding: 18px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #dcebe6;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #16806f;
        }

        .admin-label {
            color: #60756f;
            font-weight: bold;
        }


        /* ================= MAIN ================= */

        .container {
            width: 90%;
            max-width: 1100px;

            margin: 40px auto;
        }


        .title-section {
            margin-bottom: 25px;
        }

        .title-section h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .title-section p {
            color: #60756f;
        }


        /* ================= SERVICE CARD ================= */

        .service-card {
            background: white;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.07);
        }


        .service-header {

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .service-header h2 {
            color: #17352f;
        }


        .open-status {

            background: #e1f5ec;

            color: #16806f;

            padding: 8px 15px;

            border-radius: 20px;

            font-weight: bold;
        }


        /* ================= CURRENTLY SERVING ================= */

        .serving-card {

            background: #e8f6f1;

            border-radius: 15px;

            padding: 25px;

            margin-bottom: 25px;

            text-align: center;
        }


        .serving-card h2 {
            margin-bottom: 10px;
        }


        #currentToken {

            font-size: 55px;

            font-weight: bold;

            color: #16806f;

            margin: 15px 0;
        }


        #currentStudent {

            font-size: 20px;

            font-weight: bold;
        }


        #currentStatus {

            margin-top: 8px;

            color: #60756f;
        }


        /* ================= BUTTONS ================= */

        .button-area {

            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 20px;

            flex-wrap: wrap;
        }


        button {

            border: none;

            padding: 13px 25px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .call-button {

            background: #16806f;

            color: white;
        }


        .serve-button {

            background: #e9a23b;

            color: white;
        }


        .complete-button {

            background: #3867d6;

            color: white;
        }


        button:hover {

            opacity: 0.9;
        }


        button:disabled {

            background: #bfcac6;

            cursor: not-allowed;
        }


        /* ================= QUEUE TABLE ================= */

        .queue-card {

            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.07);
        }


        .queue-card h2 {

            margin-bottom: 20px;
        }


        .queue-table {

            width: 100%;

            border-collapse: collapse;
        }


        .queue-table th,
        .queue-table td {

            padding: 15px;

            text-align: left;

            border-bottom: 1px solid #e6eeea;
        }


        .queue-table th {

            background: #f6faf8;

            color: #60756f;
        }


        .status {

            font-weight: bold;
        }


        .waiting {

            color: #16806f;
        }


        .called {

            color: #e09a22;
        }


        .serving {

            color: #3867d6;
        }


        .completed {

            color: #60756f;
        }


        .empty-message {

            text-align: center;

            color: #60756f;

            padding: 30px;
        }


        /* ================= MESSAGE ================= */

        #message {

            margin-bottom: 20px;

            padding: 12px 15px;

            border-radius: 8px;

            display: none;

            text-align: center;

            font-weight: bold;
        }


        .success-message {

            background: #e1f5ec;

            color: #16806f;
        }


        .error-message {

            background: #fff1f0;

            color: #b42318;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .container {

                width: 94%;
            }


            .title-section h1 {

                font-size: 28px;
            }


            .service-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }


            .queue-table {

                font-size: 14px;
            }


            .queue-table th,
            .queue-table td {

                padding: 10px 6px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">

            QueueLess

        </div>


        <div class="admin-label">

            Admin Dashboard

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- TITLE -->

        <section class="title-section">

            <h1>

                Queue Management

            </h1>


            <p>

                Manage the Accounts Office student queue.

            </p>

        </section>



        <!-- MESSAGE -->

        <div id="message"></div>



        <!-- SERVICE -->

        <section class="service-card">


            <div class="service-header">


                <h2>

                    Accounts Office

                </h2>


                <span class="open-status">

                    ● OPEN

                </span>


            </div>


        </section>



        <!-- ================= CURRENTLY SERVING ================= -->

        <section class="serving-card">


            <h2>

                Current Queue

            </h2>


            <div id="currentToken">

                —

            </div>


            <div id="currentStudent">

                No student currently serving

            </div>


            <div id="currentStatus">

                Waiting for queue action

            </div>



            <!-- BUTTONS -->

            <div class="button-area">


                <button
                    class="call-button"
                    id="callButton"
                    onclick="callNext()">

                    CALL NEXT

                </button>



                <button
                    class="serve-button"
                    id="serveButton"
                    onclick="startServing()"
                    disabled>

                    START SERVING

                </button>



                <button
                    class="complete-button"
                    id="completeButton"
                    onclick="completeServing()"
                    disabled>

                    COMPLETE

                </button>


            </div>


        </section>



        <!-- ================= WAITING QUEUE ================= -->

        <section class="queue-card">


            <h2>

                Queue

            </h2>


            <table class="queue-table">


                <thead>

                    <tr>

                        <th>
                            Token
                        </th>

                        <th>
                            Student
                        </th>

                        <th>
                            Service
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>



                <tbody id="queueTableBody">


                    <tr>

                        <td
                            colspan="4"
                            class="empty-message">

                            Loading queue...

                        </td>

                    </tr>


                </tbody>


            </table>


        </section>


    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /*
         * SHOW MESSAGE
         */

        function showMessage(
            message,
            success
        ) {


            const messageBox =
                document.getElementById(
                    "message"
                );


            messageBox.textContent =
                message;


            messageBox.style.display =
                "block";


            if (success) {

                messageBox.className =
                    "success-message";

            } else {

                messageBox.className =
                    "error-message";
            }


            setTimeout(
                function() {

                    messageBox.style.display =
                        "none";

                },
                3000
            );

        }



        /*
         * CALL NEXT
         *
         * WAITING → CALLED
         */

        function callNext() {


            fetch(
                "AdminQueueServlet",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/x-www-form-urlencoded"

                    },

                    body:
                        "action=CALL_NEXT"

                }
            )


            .then(
                response =>
                    response.json()
            )


            .then(
                data => {


                    if (data.success) {


                        showMessage(
                            data.message,
                            true
                        );


                    } else {


                        showMessage(
                            data.message,
                            false
                        );

                    }


                    loadQueue();

                }
            )


            .catch(
                error => {


                    console.error(
                        error
                    );


                    showMessage(
                        "Unable to connect to server.",
                        false
                    );

                }
            );

        }



        /*
         * START SERVING
         *
         * CALLED → SERVING
         */

        function startServing() {


            fetch(
                "AdminQueueServlet",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/x-www-form-urlencoded"

                    },

                    body:
                        "action=START_SERVING"

                }
            )


            .then(
                response =>
                    response.json()
            )


            .then(
                data => {


                    if (data.success) {


                        showMessage(
                            data.message,
                            true
                        );


                    } else {


                        showMessage(
                            data.message,
                            false
                        );

                    }


                    loadQueue();

                }
            )


            .catch(
                error => {


                    console.error(
                        error
                    );


                    showMessage(
                        "Unable to connect to server.",
                        false
                    );

                }
            );

        }



        /*
         * COMPLETE
         *
         * SERVING → COMPLETED
         */

        function completeServing() {


            fetch(
                "AdminQueueServlet",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/x-www-form-urlencoded"

                    },

                    body:
                        "action=COMPLETE"

                }
            )


            .then(
                response =>
                    response.json()
            )


            .then(
                data => {


                    if (data.success) {


                        showMessage(
                            data.message,
                            true
                        );


                    } else {


                        showMessage(
                            data.message,
                            false
                        );

                    }


                    loadQueue();

                }
            )


            .catch(
                error => {


                    console.error(
                        error
                    );


                    showMessage(
                        "Unable to connect to server.",
                        false
                    );

                }
            );

        }



        /*
         * LOAD QUEUE FROM JAVA
         */

        function loadQueue() {


            fetch(
                "AdminQueueServlet"
            )


            .then(
                response =>
                    response.json()
            )


            .then(
                data => {


                    if (!Array.isArray(data)) {


                        console.error(
                            data
                        );


                        showMessage(
                            data.message ||
                            "Unable to load queue.",
                            false
                        );


                        return;

                    }



                    const tableBody =
                        document.getElementById(
                            "queueTableBody"
                        );


                    tableBody.innerHTML =
                        "";



                    /*
                     * NO STUDENTS
                     */

                    if (data.length === 0) {


                        tableBody.innerHTML =

                            "<tr>"
                            +
                            "<td colspan='4' "
                            +
                            "class='empty-message'>"
                            +
                            "No students in queue"
                            +
                            "</td>"
                            +
                            "</tr>";


                        resetCurrentStudent();


                        return;

                    }



                    /*
                     * DISPLAY ALL STUDENTS
                     */

                    data.forEach(
                        function(student) {


                            const row =
                                document.createElement(
                                    "tr"
                                );


                            let statusClass =
                                student.status
                                .toLowerCase();


                            row.innerHTML =

                                "<td>"
                                +
                                student.token
                                +
                                "</td>"

                                +

                                "<td>"
                                +
                                student.studentName
                                +
                                "</td>"

                                +

                                "<td>"
                                +
                                student.serviceName
                                +
                                "</td>"

                                +

                                "<td class='status "
                                +
                                statusClass
                                +
                                "'>"
                                +
                                student.status
                                +
                                "</td>";


                            tableBody.appendChild(
                                row
                            );

                        }
                    );



                    /*
                     * FIND CURRENT STUDENT
                     */

                    let currentStudent =
                        null;


                    data.forEach(
                        function(student) {


                            if (
                                student.status ===
                                "CALLED"
                                ||
                                student.status ===
                                "SERVING"
                            ) {


                                currentStudent =
                                    student;

                            }

                        }
                    );



                    /*
                     * DISPLAY CURRENT STUDENT
                     */

                    if (
                        currentStudent !== null
                    ) {


                        document.getElementById(
                            "currentToken"
                        ).textContent =
                            currentStudent.token;


                        document.getElementById(
                            "currentStudent"
                        ).textContent =
                            currentStudent.studentName;


                        document.getElementById(
                            "currentStatus"
                        ).textContent =
                            currentStudent.status;


                    } else {


                        resetCurrentStudent();

                    }



                    /*
                     * BUTTON STATES
                     */

                    updateButtons(data);

                }
            )


            .catch(
                error => {


                    console.error(
                        "Queue loading error:",
                        error
                    );


                    showMessage(
                        "Unable to load queue.",
                        false
                    );

                }
            );

        }



        /*
         * UPDATE BUTTONS
         */

        function updateButtons(data) {


            const callButton =
                document.getElementById(
                    "callButton"
                );


            const serveButton =
                document.getElementById(
                    "serveButton"
                );


            const completeButton =
                document.getElementById(
                    "completeButton"
                );



            let hasWaiting =
                false;


            let hasCalled =
                false;


            let hasServing =
                false;



            data.forEach(
                function(student) {


                    if (
                        student.status ===
                        "WAITING"
                    ) {

                        hasWaiting =
                            true;

                    }


                    if (
                        student.status ===
                        "CALLED"
                    ) {

                        hasCalled =
                            true;

                    }


                    if (
                        student.status ===
                        "SERVING"
                    ) {

                        hasServing =
                            true;

                    }

                }
            );



            /*
             * CALL NEXT
             */

            callButton.disabled =
                !hasWaiting;



            /*
             * START SERVING
             */

            serveButton.disabled =
                !hasCalled;



            /*
             * COMPLETE
             */

            completeButton.disabled =
                !hasServing;

        }



        /*
         * RESET CURRENT STUDENT
         */

        function resetCurrentStudent() {


            document.getElementById(
                "currentToken"
            ).textContent =
                "—";


            document.getElementById(
                "currentStudent"
            ).textContent =
                "No student currently serving";


            document.getElementById(
                "currentStatus"
            ).textContent =
                "Waiting for queue action";

        }



        /*
         * LOAD QUEUE WHEN PAGE OPENS
         */

        loadQueue();



        /*
         * AUTO REFRESH EVERY 5 SECONDS
         */

        setInterval(
            loadQueue,
            5000
        );


    </script>


</body>

</html>
